name: Capture Limick and CaseClosed project previews
on:
  push:
    branches: [show-limick-caseclosed-previews]
    paths: ['.github/workflows/project-preview-capture.yml']
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare screenshot browser
        run: |
          mkdir -p /tmp/capture
          cd /tmp/capture
          npm init -y >/dev/null
          npm install --silent --no-fund --no-audit playwright@1.57.0
      - name: Capture live Limick and CaseClosed screens
        run: |
          node <<'JS'
          const { chromium }=require('/tmp/capture/node_modules/playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({channel:'chrome',headless:true,args:['--no-sandbox']});
            const sites=[
              {name:'limick',url:'https://limick.vercel.app/'},
              {name:'caseclosed',url:'https://caseclosed-the-blind-angle.windyrhino8195.chatgpt.site/game/'}
            ];
            for(const site of sites){
              const page=await browser.newPage({viewport:{width:1366,height:900},deviceScaleFactor:1});
              try {
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                const response=await page.goto(site.url,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(4500);
                const title=await page.title();
                const body=await page.locator('body').innerText({timeout:8000});
                const buttons=await page.locator('button').allInnerTexts();
                console.log('SITE',site.name,'status',response?.status(),'url',page.url,'title',JSON.stringify(title));
                console.log('BODY',site.name,JSON.stringify(body.slice(0,1800)));
                console.log('BUTTONS',site.name,JSON.stringify(buttons.slice(0,30)));
                console.log('ERRORS',site.name,JSON.stringify(errors.slice(0,5)));
                if (!response || response.status()!==200 || /Authentication Required|Log in to Vercel|404: NOT_FOUND/i.test(title+" "+body)) throw Error('Invalid public page '+site.name);
                if(site.name==='caseclosed'){
                  const steps=['[data-action="skip-cinema"]','[data-action="start"]','[data-go="scene"]'];
                  for(const selector of steps){
                    const el=page.locator(selector).first();
                    try{
                      if(await el.count() && await el.isVisible()){
                        await el.click({timeout:4000,force:true});
                        console.log('ADVANCED',selector);
                        await page.waitForTimeout(1000);
                      }
                    }catch(e){console.log('SKIP-ADVANCE',selector,String(e).slice(0,130))}
                  }
                  console.log('FINAL-CASE-STAGE',JSON.stringify((await page.locator('body').innerText()).slice(0,650)));
                }
                const out='client/public/images/project-'+site.name+'.jpg';
                await page.screenshot({path:out,type:'jpeg',quality:88,animations:'disabled'});
                if(fs.statSync(out).size<10000)throw Error('Suspiciously small screenshot '+out);
                console.log('CAPTURED',out,fs.statSync(out).size);
              } finally {await page.close();}
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Commit the two site screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/images/project-limick.jpg client/public/images/project-caseclosed.jpg
          git diff --staged --quiet || { git commit -m "Add authentic Limick and CaseClosed website screenshots"; git push origin HEAD:show-limick-caseclosed-previews; }
